<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Lockstep demo</title>
    <style>
        html, body, canvas {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: absolute;
            background: #0f1117;
            z-index: 0;
        }
        canvas:focus { outline: none; }
    </style>
</head>
<body>
    <!-- oncontextmenu stops right-click from opening the browser menu -->
    <canvas id="glcanvas" tabindex="1" oncontextmenu="return false"></canvas>
    <!-- gl.js and sapp_jsutils.js are copied in by build-web.sh -->
    <script src="gl.js"></script>
    <script src="sapp_jsutils.js"></script>
    <script src="lockstep_net.js"></script>
    <script>load("lockstep-demo.wasm");</script>
</body>
</html>
