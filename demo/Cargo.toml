[package]
name = "lockstep-demo"
version = "0.1.0"
edition = "2021"

[dependencies]
macroquad = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop: websocket on a background thread.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = "0.30"

# Browser: lets Rust pass strings to and from the JS plugin in web/lockstep_net.js.
[target.'cfg(target_arch = "wasm32")'.dependencies]
sapp-jsutils = "0.1"

[profile.release]
opt-level = 3
